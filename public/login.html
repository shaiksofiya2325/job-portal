<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Job Portal</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav>
        <div class="logo"><a href="/">JobPortal</a></div>
        <ul class="nav-links">
            <li><a href="/">Find Jobs</a></li>
            <li id="login-link"><a href="/login.html">Login</a></li>
            <li id="register-link"><a href="/register.html">Register</a></li>
            <li id="dashboard-link" class="nav-hidden"><a href="/dashboard.html">Dashboard</a></li>
            <li id="logout-btn" class="nav-hidden"><a href="#">Logout</a></li>
        </ul>
    </nav>

    <main>
        <div class="container form-container">
            <h2>Login to Your Account</h2>
            <form id="login-form">
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit">Login</button>
            </form>
            <p id="error-message"></p>
            <p class="form-switch">Don't have an account? <a href="/register.html">Register here</a></p>
        </div>
    </main>

    <script src="/js/nav.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
